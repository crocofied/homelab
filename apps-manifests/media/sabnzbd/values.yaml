controllers:
  sabnzbd:
    strategy: Recreate
    initContainers:
      set-whitelist:
        image:
          repository: busybox
          tag: "1.38"
        command:
          - sh
          - -c
          - |
            f=/config/sabnzbd.ini
            [ -f "$f" ] || exit 0
            if grep -q '^host_whitelist' "$f"; then
              sed -i 's|^host_whitelist.*|host_whitelist = sabnzbd.damians.cloud|' "$f"
            else
              sed -i '/^\[misc\]/a host_whitelist = sabnzbd.damians.cloud' "$f"
            fi
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/sabnzbd
          tag: 5.0.4
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
        env:
          TZ: Europe/Berlin
          PUID: "1000"
          PGID: "1000"
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true

defaultPodOptions:
  labels:
    workload: selfhosted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: selfhosted
  securityContext:
    fsGroup: 1000

service:
  app:
    controller: sabnzbd
    ports:
      http:
        port: 8080

ingress:
  app:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - host: sabnzbd.damians.cloud
        paths:
          - path: /
            service:
              identifier: app
              port: http
    tls:
      - secretName: sabnzbd-tls
        hosts:
          - sabnzbd.damians.cloud

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: longhorn
    globalMounts:
      - path: /config
  media:
    existingClaim: nas-media
    globalMounts:
      - path: /media