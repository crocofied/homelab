controllers:
  excalidash-backend:
    containers:
      app:
        image:
          repository: zimengxiong/excalidash-backend
          tag: 0.6.0
        env:
          DATABASE_PROVIDER: sqlite
          DATABASE_URL: file:/app/prisma/dev.db
          PORT: "8000"
          NODE_ENV: production
          FRONTEND_URL: https://excalidash.damians.cloud
          AUTH_MODE: oidc_enforced
          OIDC_PROVIDER_NAME: 'damians.cloud'
          OIDC_ISSUER_URL: 'https://auth.damians.cloud'
          OIDC_CLIENT_ID: 'e4e4296d-29a1-42b2-b27d-c9a69770e980'
          OIDC_REDIRECT_URI: 'https://excalidash.damians.cloud/api/auth/oidc/callback'
          OIDC_SCOPES: openid profile email
          TRUST_PROXY: "true"
          JWT_SECRET:
            valueFrom:
              secretKeyRef:
                name: excalidash-secret
                key: JWT_SECRET
          CSRF_SECRET:
            valueFrom:
              secretKeyRef:
                name: excalidash-secret
                key: CSRF_SECRET
          OIDC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: tinyauth-oidc
                key: EXCALIDASH
          TZ: Europe/Berlin
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  excalidash:
    strategy: Recreate
    containers:
      app:
        image:
          repository: zimengxiong/excalidash-frontend
          tag: 0.5.1
        env:
          TZ: Europe/Berlin
          BACKEND_URL: excalidash-backend:8000
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        probes:
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
          liveness:
            enabled: true
          readiness:
            enabled: true

defaultPodOptions:
  labels:
    workload: selfhosted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: selfhosted
  securityContext:
    fsGroup: 1000

service:
  app:
    controller: excalidash
    ports:
      http:
        port: 80
  backend:
    controller: excalidash-backend
    ports:
      http:
        port: 8000

ingress:
  app:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - host: excalidash.damians.cloud
        paths:
          - path: /
            service:
              identifier: app
              port: http
    tls:
      - secretName: excalidash-tls
        hosts:
          - excalidash.damians.cloud

persistence:
  prisma:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    advancedMounts:
      excalidash-backend:
        app:
          - path: /app/prisma
