controllers:
  n8n:
    strategy: Recreate
    containers:
      app:
        image:
          repository: n8nio/n8n
          tag: 2.34.1
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
        env:
          GENERIC_TIMEZONE: Europe/Berlin
          N8N_SECURE_COOKIE: false
          N8N_HOST: n8n.damians.cloud
          N8N_PROTOCOL: https
          N8N_EDITOR_BASE_URL: https://n8n.damians.cloud
          WEBHOOK_URL: https://n8n.damians.cloud
          N8N_SECURE_COOKIE: true
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true

defaultPodOptions:
  labels:
    workload: selfhosted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: selfhosted
  securityContext:
    fsGroup: 1000

service:
  app:
    controller: n8n
    ports:
      http:
        port: 5678

ingress:
  app:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - host: n8n.damians.cloud
        paths:
          - path: /
            service:
              identifier: app
              port: http
    tls:
      - secretName: n8n-tls
        hosts:
          - n8n.damians.cloud

persistence:
  config:                      
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    globalMounts:
      - path: /home/node/.n8n   