controllers:
  compose2homelab:
    strategy: Recreate
    containers:
      app:
        image:
          repository: nginxinc/nginx-unprivileged
          tag: stable-alpine
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

defaultPodOptions:
  labels:
    workload: selfhosted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: selfhosted
  securityContext:
    fsGroup: 1000

service:
  app:
    controller: compose2homelab
    ports:
      http:
        port: 8080

ingress:
  app:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - host: compose.damians.cloud
        paths:
          - path: /
            service:
              identifier: app
              port: http
    tls:
      - secretName: compose2homelab-tls
        hosts:
          - compose.damians.cloud

persistence:
  html:
    type: configMap
    identifier: html
    globalMounts:
      - path: /usr/share/nginx/html
        readOnly: true

configMaps:
  html:
    data:
      index.html: |
        <!DOCTYPE html>
        <html lang="de">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>compose → homelab</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
        <style>
          :root {
            --paper: #e9eef1;
            --sheet: #fbfcfd;
            --ink: #16232b;
            --ink-soft: #5b6f7a;
            --rule: #c2ced6;
            --rule-soft: #dbe3e8;
            --verdigris: #1e6f63;
            --amber: #9a5c07;
            --rust: #8a3a2c;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
            --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
          }
          * { box-sizing: border-box; }
          html, body { margin: 0; padding: 0; }
          body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 22px;
          }
          /* registration marks: the sheet reads as a technical drawing */
          .sheet {
            position: relative;
            max-width: 1360px;
            margin: 0 auto;
            background: var(--sheet);
            border: 1px solid var(--rule);
          }
          .sheet::before, .sheet::after {
            content: "";
            position: absolute;
            width: 9px; height: 9px;
            border: 1px solid var(--ink);
            opacity: .5;
          }
          .sheet::before { top: -5px; left: -5px; border-right: 0; border-bottom: 0; }
          .sheet::after { bottom: -5px; right: -5px; border-left: 0; border-top: 0; }

          .eyebrow {
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--ink-soft);
          }

          header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 14px;
            padding: 16px 20px 14px;
            border-bottom: 1px solid var(--rule);
          }
          h1 {
            margin: 0;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: -.01em;
          }
          h1 .arrow { color: var(--verdigris); padding: 0 4px; }
          header p { margin: 0; font-family: var(--sans); font-size: 12px; color: var(--ink-soft); max-width: 46ch; }

          .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
            gap: 1px;
            background: var(--rule-soft);
            border-bottom: 1px solid var(--rule);
          }
          .field { background: var(--sheet); padding: 9px 12px 10px; }
          .field label { display: block; margin-bottom: 4px; }
          .field input, .field select {
            width: 100%;
            border: 0;
            border-bottom: 1px solid var(--rule);
            background: transparent;
            font-family: var(--mono);
            font-size: 13px;
            color: var(--ink);
            padding: 2px 0;
            border-radius: 0;
          }
          .field input:focus-visible, .field select:focus-visible {
            outline: 2px solid var(--verdigris);
            outline-offset: 2px;
          }
          .field.check { display: flex; align-items: center; gap: 8px; }
          .field.check label { margin: 0; }
          .field.check input { width: auto; }

          main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
            gap: 1px;
            background: var(--rule-soft);
          }
          .pane { background: var(--sheet); min-width: 0; display: flex; flex-direction: column; }
          .pane-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 12px;
            border-bottom: 1px solid var(--rule-soft);
          }
          .path { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          .path .dim { color: var(--ink-soft); }

          textarea, pre {
            margin: 0;
            font-family: var(--mono);
            font-size: 12.5px;
            line-height: 1.62;
            tab-size: 2;
          }
          textarea {
            flex: 1;
            min-height: 420px;
            border: 0;
            resize: vertical;
            padding: 12px;
            background: transparent;
            color: var(--ink);
          }
          textarea:focus-visible { outline: 2px solid var(--verdigris); outline-offset: -2px; }
          textarea::placeholder { color: #9aacb6; }
          pre {
            padding: 12px;
            overflow: auto;
            max-height: 200px;
            white-space: pre;
            color: var(--ink);
          }
          .out + .out { border-top: 1px solid var(--rule); }

          button {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--verdigris);
            background: transparent;
            border: 1px solid var(--verdigris);
            padding: 4px 9px;
            cursor: pointer;
            white-space: nowrap;
          }
          button:hover { background: var(--verdigris); color: var(--sheet); }
          button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
          button.ghost { color: var(--ink-soft); border-color: var(--rule); }
          button.ghost:hover { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
          button.done { background: var(--verdigris); color: var(--sheet); }

          /* signature: the diagnostics rail */
          .rail { border-top: 1px solid var(--rule); }
          .rail-head {
            display: flex;
            align-items: baseline;
            gap: 16px;
            flex-wrap: wrap;
            padding: 10px 20px;
            border-bottom: 1px solid var(--rule-soft);
          }
          .tally { display: flex; gap: 14px; flex-wrap: wrap; }
          .tally span { font-size: 11px; letter-spacing: .06em; color: var(--ink-soft); }
          .tally b { font-weight: 500; color: var(--ink); }
          .notes { list-style: none; margin: 0; padding: 0; }
          .notes li {
            display: grid;
            grid-template-columns: 84px minmax(0, 1fr);
            gap: 12px;
            padding: 8px 20px;
            border-bottom: 1px solid var(--rule-soft);
            border-left: 3px solid transparent;
          }
          .notes li:last-child { border-bottom: 0; }
          .notes .kind { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding-top: 2px; }
          .notes .text { font-family: var(--sans); font-size: 12.5px; line-height: 1.5; }
          .notes li[data-kind="guessed"] { border-left-color: var(--amber); }
          .notes li[data-kind="guessed"] .kind { color: var(--amber); }
          .notes li[data-kind="dropped"] { border-left-color: var(--rust); }
          .notes li[data-kind="dropped"] .kind { color: var(--rust); }
          .notes li[data-kind="todo"] { border-left-color: var(--verdigris); }
          .notes li[data-kind="todo"] .kind { color: var(--verdigris); }
          .notes li[data-kind="error"] { border-left-color: var(--rust); background: #fdf4f2; }
          .notes li[data-kind="error"] .kind { color: var(--rust); }
          .empty { padding: 12px 20px; font-family: var(--sans); font-size: 12.5px; color: var(--ink-soft); }

          footer {
            max-width: 1360px;
            margin: 10px auto 0;
            font-family: var(--sans);
            font-size: 11.5px;
            color: var(--ink-soft);
          }

          @media (max-width: 900px) {
            body { padding: 12px; }
            main { grid-template-columns: minmax(0, 1fr); }
            textarea { min-height: 240px; }
            .notes li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
          }
          @media (prefers-reduced-motion: no-preference) {
            button { transition: background .12s ease, color .12s ease; }
          }
        </style>
        </head>
        <body>
        <div class="sheet">
          <header>
            <h1>docker-compose<span class="arrow">→</span>app-template</h1>
            <p>Compose links einwerfen, rechts die zwei Dateien rausholen. Konventionen aus crocofied/homelab.</p>
          </header>

          <div class="controls">
            <div class="field">
              <label class="eyebrow" for="f-name">App-Name</label>
              <input id="f-name" value="app" spellcheck="false">
            </div>
            <div class="field">
              <label class="eyebrow" for="f-cat">Kategorie</label>
              <select id="f-cat">
                <option value="tools" selected>tools</option>
                <option value="media">media</option>
                <option value="monitoring">monitoring</option>
              </select>
            </div>
            <div class="field">
              <label class="eyebrow" for="f-domain">Domain</label>
              <input id="f-domain" value="damians.cloud" spellcheck="false">
            </div>
            <div class="field">
              <label class="eyebrow" for="f-tz">Zeitzone</label>
              <input id="f-tz" value="Europe/Berlin" spellcheck="false">
            </div>
            <div class="field">
              <label class="eyebrow" for="f-size">PVC-Standard</label>
              <input id="f-size" value="5Gi" spellcheck="false">
            </div>
            <div class="field">
              <label class="eyebrow" for="f-chart">Chart-Version</label>
              <input id="f-chart" value="5.0.1" spellcheck="false">
            </div>
            <div class="field check">
              <input type="checkbox" id="f-gpu">
              <label class="eyebrow" for="f-gpu">Intel-GPU</label>
            </div>
            <div class="field check">
              <input type="checkbox" id="f-ingress" checked>
              <label class="eyebrow" for="f-ingress">Ingress</label>
            </div>
            <div class="field check">
              <input type="checkbox" id="f-cnpg" checked>
              <label class="eyebrow" for="f-cnpg">Postgres → CNPG</label>
            </div>
            <div class="field">
              <label class="eyebrow" for="f-shell">Shell</label>
              <select id="f-shell">
                <option value="powershell" selected>PowerShell</option>
                <option value="bash">bash</option>
              </select>
            </div>
          </div>

          <main>
            <section class="pane">
              <div class="pane-head">
                <span class="path eyebrow">Compose einwerfen</span>
                <button class="ghost" id="btn-sample">Beispiel</button>
              </div>
              <textarea id="in" spellcheck="false" placeholder="services:
          bazarr:
            image: lscr.io/linuxserver/bazarr:latest
            ports:
              - 6767:6767
            volumes:
              - ./config:/config
              - /nas/tv:/tv"></textarea>
            </section>

            <section class="pane">
              <div class="out" id="card-app">
                <div class="pane-head">
                  <span class="path"><span class="dim">apps/</span><span id="p-app">app.yaml</span></span>
                  <button id="btn-app">Kopieren</button>
                </div>
                <pre id="out-app">—</pre>
              </div>
              <div class="out" id="card-values">
                <div class="pane-head">
                  <span class="path"><span class="dim">apps-manifests/</span><span id="p-values">…/values.yaml</span></span>
                  <button id="btn-values">Kopieren</button>
                </div>
                <pre id="out-values">—</pre>
              </div>
              <div class="out" id="card-dbcluster" hidden>
                <div class="pane-head">
                  <span class="path"><span class="dim">infrastructure/databases/</span><span id="p-dbcluster"></span></span>
                  <button id="btn-dbcluster">Kopieren</button>
                </div>
                <pre id="out-dbcluster"></pre>
              </div>
              <div class="out" id="card-dbapp" hidden>
                <div class="pane-head">
                  <span class="path"><span class="dim">apps/</span><span id="p-dbapp"></span></span>
                  <button id="btn-dbapp">Kopieren</button>
                </div>
                <pre id="out-dbapp"></pre>
              </div>
              <div class="out" id="card-secret" hidden>
                <div class="pane-head">
                  <span class="path"><span class="dim">Befehl für </span><span id="p-secret"></span></span>
                  <button id="btn-secret">Kopieren</button>
                </div>
                <pre id="out-secret"></pre>
              </div>
            </section>
          </main>

          <section class="rail">
            <div class="rail-head">
              <span class="eyebrow">Was nicht 1:1 übersetzbar war</span>
              <div class="tally" id="tally"></div>
            </div>
            <ul class="notes" id="notes"></ul>
            <p class="empty" id="empty">Noch nichts konvertiert.</p>
          </section>
        </div>
        <footer>Prüft nichts gegen den Cluster — vor dem Commit einmal <code>helm template</code> drüberlaufen lassen.</footer>

        <script>
        // compose -> bjw-s app-template values.yaml + ArgoCD Application (+ CNPG cluster + sealed secret command)
        // Conventions derived from github.com/crocofied/homelab

        const WELL_KNOWN_PORTS = {
          6379: 'redis', 5432: 'postgres', 3306: 'mysql', 27017: 'mongo',
          11211: 'memcache', 9000: 'api', 8080: 'http', 80: 'http', 443: 'https',
        };

        const SKIP_MOUNTS = [/\/etc\/localtime/, /\/etc\/timezone/, /docker\.sock/, /\/sys\//, /\/proc\//];
        const NAS_HINT = /(^|\/)(media|movies|tv|shows|series|music|books|photos|documents|downloads|usenet|torrents)(\/|$)/i;
        const SECRET_KEY = /(PASSWORD|PASSWD|SECRET|TOKEN|APIKEY|API_KEY|_KEY$|_SALT$|CREDENTIALS)/i;
        const EXTERNAL_SECRET = /(SMTP|MAIL|OIDC|OAUTH|CLIENT_SECRET|SENTRY|DSN|LICENSE|WEBHOOK|SLACK|DISCORD|GITHUB|GOOGLE|STRIPE|CLOUDFLARE|TELEGRAM)/i;
        const PG_IMAGE = /(^|\/)(postgres|postgresql)(:|@|$)/i;
        const OTHER_DB_IMAGE = /(^|\/)(mariadb|mysql|percona|mongo)(:|@|$)/i;
        const IMAGE_PORTS = [
          [/valkey|redis/i, 6379], [/postgres/i, 5432], [/mariadb|mysql/i, 3306],
          [/mongo/i, 27017], [/memcached/i, 11211], [/rabbitmq/i, 5672], [/meilisearch/i, 7700],
          [/typesense/i, 8108], [/elasticsearch|opensearch/i, 9200], [/solr/i, 8983],
        ];

        // compose env key -> key inside the CNPG "<cluster>-app" secret
        const CNPG_KEYS = [
          [/(_|^)(URL|URI|DSN)$/i, 'uri'],
          [/(HOST|HOSTNAME|SERVER|ADDR)/i, 'host'],
          [/PORT/i, 'port'],
          [/(USERNAME|USER|OWNER)/i, 'username'],
          [/(PASSWORD|PASSWD|PASS)/i, 'password'],
          [/(DATABASE|DBNAME|DB_NAME|_DB$|^DB$)/i, 'dbname'],
        ];
        const DB_ENV_HINT = /(^|_)(DB|DATABASE|POSTGRES|PG|SQL)/i;

        const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

        const MERGE_KEY = '<<';
        function resolveMerge(node) {
          if (Array.isArray(node)) return node.map(resolveMerge);
          if (node && typeof node === 'object') {
            const explicit = {}, merged = {};
            for (const [k, v] of Object.entries(node)) {
              if (k === MERGE_KEY) {
                for (const m of (Array.isArray(v) ? v : [v])) {
                  const r = resolveMerge(m);
                  if (r && typeof r === 'object') Object.assign(merged, r);
                }
              } else explicit[k] = resolveMerge(v);
            }
            return Object.assign(merged, explicit);
          }
          return node;
        }

        function parseImage(image) {
          if (!image) return { repository: 'CHANGEME', tag: 'latest' };
          const at = image.indexOf('@');
          if (at > -1) return { repository: image.slice(0, at), tag: image.slice(at + 1) };
          const lastColon = image.lastIndexOf(':');
          const lastSlash = image.lastIndexOf('/');
          if (lastColon > lastSlash && lastColon > -1) {
            return { repository: image.slice(0, lastColon), tag: image.slice(lastColon + 1) };
          }
          return { repository: image, tag: 'latest' };
        }

        function normEnv(env) {
          const out = {};
          if (!env) return out;
          if (Array.isArray(env)) {
            for (const line of env) {
              const s = String(line);
              const i = s.indexOf('=');
              if (i === -1) { out[s] = null; continue; }
              out[s.slice(0, i)] = s.slice(i + 1);
            }
          } else {
            for (const [k, v] of Object.entries(env)) out[k] = v;
          }
          return out;
        }

        function normVolumes(vols) {
          const out = [];
          if (!Array.isArray(vols)) return out;
          for (const v of vols) {
            if (typeof v === 'string') {
              const parts = v.split(':');
              if (parts.length === 1) out.push({ source: null, target: parts[0], ro: false });
              else out.push({ source: parts[0], target: parts[1], ro: (parts[2] || '').includes('ro') });
            } else if (v && typeof v === 'object') {
              out.push({ source: v.source || null, target: v.target, ro: !!v.read_only });
            }
          }
          return out.filter((v) => v.target);
        }

        function normPorts(svc) {
          const out = [];
          const push = (p) => {
            const s = String(p).split('/')[0];
            const parts = s.split(':');
            const n = parseInt(parts[parts.length - 1], 10);
            if (!isNaN(n) && !out.includes(n)) out.push(n);
          };
          for (const p of svc.ports || []) {
            if (typeof p === 'object' && p.target) push(p.target); else push(p);
          }
          for (const p of svc.expose || []) push(p);
          return out;
        }

        function shellSplit(str) {
          const out = [];
          let cur = '', quote = null, started = false;
          for (const ch of String(str)) {
            if (quote) { if (ch === quote) quote = null; else cur += ch; }
            else if (ch === '"' || ch === "'") { quote = ch; started = true; }
            else if (/\s/.test(ch)) { if (cur || started) { out.push(cur); cur = ''; started = false; } }
            else cur += ch;
          }
          if (cur || started) out.push(cur);
          return out;
        }

        function normSize(v, fallback) {
          if (!v) return fallback;
          const m = String(v).match(/^(\d+)\s*([GgMm])/);
          if (!m) return fallback;
          return m[2].toLowerCase() === 'g' ? m[1] + 'Gi' : m[1] + 'Mi';
        }

        function convert(rawCompose, opts) {
          const compose = resolveMerge(rawCompose) || {};
          const notes = [];
          const note = (kind, text, group, item) => notes.push({ kind, text, group, item });
          const name = slug(opts.name || 'app');
          const category = opts.category || 'tools';
          const domain = opts.domain || 'example.com';
          const host = name + '.' + domain;
          const services = compose.services || {};
          const svcNames = Object.keys(services);
          if (!svcNames.length) throw new Error('Keine services: im Compose gefunden.');

          const main = svcNames.find((n) => normPorts(services[n]).length) || svcNames[0];

          const controllers = {};
          const serviceBlock = {};
          const persistence = {};
          const usedPersist = new Set();
          const bySource = {};
          const dnsMap = {};
          const envPatch = [];
          const secretKeys = new Set();
          const gpuCtrls = new Set();
          let wantsGpu = !!opts.gpu;
          let pg = null;

          for (const svcName of svcNames) {
            const svc = services[svcName] || {};
            const isMain = svcName === main;
            const ctrlName = isMain ? name : name + '-' + slug(svcName);
            const ctrl = {};
            if (isMain) ctrl.strategy = 'Recreate';
            ctrl.containers = { app: {} };
            const c = ctrl.containers.app;
            const image = String(svc.image || '');

            c.image = parseImage(svc.image);
            if (!svc.image && svc.build) {
              note('dropped', svcName + ': build: — Kubernetes baut nichts, das Image muss vorher in eine Registry.');
            }

            // command / args, including the sh -c special case
            const cmd = svc.entrypoint == null ? null
              : (Array.isArray(svc.entrypoint) ? svc.entrypoint.map(String) : shellSplit(svc.entrypoint));
            let args = null;
            if (svc.command != null) {
              if (Array.isArray(svc.command)) args = svc.command.map(String);
              else if (cmd && cmd[cmd.length - 1] === '-c') args = [String(svc.command)];
              else {
                args = shellSplit(svc.command);
                if (/[|&;><`]/.test(String(svc.command))) note('todo', svcName + ': command enthält Shell-Syntax, wurde aber in Argumente zerlegt. Besser command: ["/bin/sh","-c"] plus args mit dem ganzen String.');
              }
            }
            if (cmd) c.command = cmd;
            if (args) c.args = args;
            const argVars = new Set();
            for (const list of [c.command, c.args]) {
              if (!list) continue;
              for (let i = 0; i < list.length; i++) {
                list[i] = list[i].replace(/\$\{(\w+)\}|\$(\w+)/g, (m, a, b) => { argVars.add(a || b); return '$(' + (a || b) + ')'; });
              }
            }

            // env
            const env = normEnv(svc.environment);
            const outEnv = {};
            for (const [k, v] of Object.entries(env)) {
              if (v === null || v === undefined) {
                note('dropped', svcName + ': ' + k + ' hatte keinen Wert (kam aus der Host-Shell) — selbst setzen oder weglassen.');
                continue;
              }
              const str = String(v);
              if (SECRET_KEY.test(k) || /\$\{?\w/.test(str)) {
                outEnv[k] = { valueFrom: { secretKeyRef: { name: name + '-secret', key: k } } };
                secretKeys.add(k);
                continue;
              }
              outEnv[k] = str;
            }
            for (const v of argVars) {
              if (v in outEnv) continue;
              if (SECRET_KEY.test(v)) {
                outEnv[v] = { valueFrom: { secretKeyRef: { name: name + '-secret', key: v } } };
                secretKeys.add(v);
                note('todo', svcName + ': command referenziert ' + v + '. Kubernetes expandiert nur $(VAR) aus env, deshalb steht die Variable jetzt als env drin und im Secret.');
              } else {
                note('todo', svcName + ': command referenziert ' + v + ', die Variable ist aber nirgends definiert. Als env nachtragen, sonst bleibt $(' + v + ') wörtlich stehen.');
              }
            }
            if (opts.tz && !('TZ' in outEnv)) outEnv.TZ = opts.tz;
            if (Object.keys(outEnv).length) { c.env = outEnv; envPatch.push([svcName, outEnv]); }
            if (svc.env_file) {
              const files = [].concat(svc.env_file).map((f) => (typeof f === 'string' ? f : f.path)).join(', ');
              note('todo', svcName + ': env_file ' + files + ' — Inhalt mit ins SealedSecret aufnehmen und per envFrom einbinden.');
            }

            // resources
            const rs = (svc.deploy || {}).resources || {};
            const req = rs.reservations || {};
            const lim = rs.limits || {};
            c.resources = {
              requests: {
                cpu: req.cpus ? Math.round(parseFloat(req.cpus) * 1000) + 'm' : '100m',
                memory: normSize(req.memory, '256Mi'),
              },
            };
            if (lim.memory || svc.mem_limit) c.resources.limits = { memory: normSize(lim.memory || svc.mem_limit, '1Gi') };

            // devices
            const devices = (svc.devices || []).map(String);
            if (devices.some((d) => d.includes('/dev/dri'))) {
              wantsGpu = true;
              gpuCtrls.add(ctrlName);
              note('guessed', svcName + ': /dev/dri erkannt → Intel-GPU-Requests und nodeSelector gesetzt, wie bei jellyfin.');
            }
            const otherDevices = devices.filter((d) => !d.includes('/dev/dri'));
            if (otherDevices.length) note('dropped', svcName + ': devices ' + otherDevices.join(', ') + ' — braucht ein Device-Plugin oder hostPath.');

            if (isMain) c.probes = { liveness: { enabled: true }, readiness: { enabled: true } };

            // volumes
            for (const vol of normVolumes(svc.volumes)) {
              if (SKIP_MOUNTS.some((re) => re.test(vol.target) || (vol.source && re.test(vol.source)))) {
                note('dropped', svcName + ': Mount ' + vol.target + ' wird in Kubernetes nicht gebraucht.');
                continue;
              }
              const mount = { path: vol.target };
              const isNas = (vol.source && NAS_HINT.test(vol.source)) || NAS_HINT.test(vol.target);
              const base = vol.target.split('/').filter(Boolean).pop() || 'data';
              const srcBase = vol.source ? (vol.source.split('/').filter(Boolean).pop() || '') : '';
              if (isNas && srcBase && srcBase.toLowerCase() === base.toLowerCase()) mount.subPath = slug(base);
              if (vol.ro) mount.readOnly = true;

              if (isNas) {
                if (vol.source && bySource[vol.source] === 'media') { persistence.media.__mounts.push({ ctrl: ctrlName, mount }); continue; }
                if (vol.source) bySource[vol.source] = 'media';
                if (!persistence.media) { persistence.media = { existingClaim: 'nas-media', __mounts: [] }; usedPersist.add('media'); }
                persistence.media.__mounts.push({ ctrl: ctrlName, mount });
                note('guessed', svcName + ': ' + vol.target + ' kommt aus dem NAS-Claim nas-media' + (mount.subPath ? ' (subPath ' + mount.subPath + ')' : '') + '. Falls das kein Share ist, in ein eigenes PVC umbauen.');
                continue;
              }

              if (vol.source && bySource[vol.source]) {
                const existing = persistence[bySource[vol.source]];
                existing.__mounts.push({ ctrl: ctrlName, mount });
                if (existing.accessMode === 'ReadWriteOnce') {
                  existing.accessMode = 'ReadWriteMany';
                  note('todo', 'Volume "' + vol.source + '" hängt in mehreren Services → PVC "' + bySource[vol.source] + '" auf ReadWriteMany gesetzt. Longhorn braucht dafür den share-manager, sonst die Container in einen Controller legen.');
                }
                continue;
              }

              let key = slug(base);
              if (usedPersist.has(key)) key = slug(svcName + '-' + key);
              let i = 2;
              while (usedPersist.has(key)) key = slug(key + '-' + i++);
              usedPersist.add(key);
              if (vol.source) bySource[vol.source] = key;
              persistence[key] = {
                type: 'persistentVolumeClaim',
                accessMode: 'ReadWriteOnce',
                size: opts.defaultSize || '5Gi',
                storageClass: 'longhorn',
                __mounts: [{ ctrl: ctrlName, mount }],
              };
              note('guessed', '', 'pvcsize', key);
              if (/\.[a-z0-9]{2,5}$/i.test(base)) {
                note('todo', svcName + ': ' + vol.target + ' ist eine einzelne Datei — gehört in den configMaps-Block des Charts, nicht in ein PVC.');
              }
            }

            // ports
            let ports = normPorts(svc);
            if (!ports.length && !isMain) {
              const hit = IMAGE_PORTS.find(([re]) => re.test(image));
              if (hit) {
                ports = [hit[1]];
                note('guessed', svcName + ': kein ports: im Compose, Standardport ' + hit[1] + ' aus dem Image abgeleitet, damit die anderen Container es erreichen.');
              }
            }
            if (ports.length) {
              const id = isMain ? 'app' : slug(svcName);
              const portMap = {};
              ports.forEach((p, idx) => {
                let pname = isMain && idx === 0 ? 'http' : (WELL_KNOWN_PORTS[p] || 'tcp-' + p);
                if (portMap[pname]) pname = 'tcp-' + p;
                portMap[pname] = { port: p };
              });
              serviceBlock[id] = { controller: ctrlName, ports: portMap };
              dnsMap[svcName] = name + '-' + id;
            }

            // database detection
            if (PG_IMAGE.test(image)) {
              pg = {
                svcName, ctrlName,
                dbname: slug(env.POSTGRES_DB || env.POSTGRES_DATABASE || name),
                owner: slug(env.POSTGRES_USER || env.POSTGRES_USERNAME || name),
                major: (parseImage(svc.image).tag.match(/^(\d+)/) || [])[1] || null,
                size: opts.defaultSize || '5Gi',
              };
            } else if (OTHER_DB_IMAGE.test(image)) {
              note('todo', svcName + ': ' + parseImage(svc.image).repository + ' — für MySQL/Mongo hast du keinen Operator im Cluster, das bleibt ein Controller mit PVC.');
            }

            // leftovers
            if (svc.depends_on) note('todo', '', 'dependson', svcName);
            if (svc.healthcheck) note('guessed', '', 'healthcheck', svcName);
            if (svc.network_mode === 'host') note('todo', svcName + ': network_mode host → hostNetwork: true in defaultPodOptions, die Ports liegen dann direkt auf dem Node.');
            if (svc.privileged) note('todo', svcName + ': privileged: true → securityContext.privileged selbst setzen.');
            if (svc.cap_add) note('todo', svcName + ': cap_add ' + [].concat(svc.cap_add).join(', ') + ' → securityContext.capabilities.add.');
            if (svc.sysctls) note('dropped', svcName + ': sysctls → defaultPodOptions.securityContext.sysctls, unsichere brauchen eine kubelet-Allowlist.');
            if (svc.user) note('todo', svcName + ': user ' + svc.user + ' → runAsUser/runAsGroup prüfen, hier steht nur fsGroup 1000.');
            if (svc.secrets) {
              const ss = [].concat(svc.secrets).map((x) => (typeof x === 'string' ? x : x.source)).join(', ');
              note('todo', svcName + ': Compose-Secrets ' + ss + ' — als SealedSecret anlegen und per persistence type secret mounten.');
            }
            if (svc.configs) note('todo', svcName + ': Compose-Configs → configMaps-Block des Charts.');
            if (svc.labels && /traefik/i.test(JSON.stringify(svc.labels))) note('dropped', svcName + ': Traefik-Labels — Routing kommt hier aus dem ingress-Block.');

            controllers[ctrlName] = ctrl;
          }

          // rewrite compose service names inside URLs
          for (const [svcName, envObj] of envPatch) {
            for (const [k, v] of Object.entries(envObj)) {
              if (typeof v !== 'string') continue;
              const hostish = /(HOST|HOSTNAME|SERVER|ADDR|ENDPOINT|_URL|_URI|_DSN)/i.test(k);
              let next = v;
              for (const [other, dns] of Object.entries(dnsMap)) {
                if (other === svcName) continue;
                const esc = other.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (hostish && next === other) next = dns;
                next = next.replace(new RegExp('(//|@)' + esc + '(?=[:/?]|$)', 'g'), '$1' + dns);
              }
              if (next !== v) {
                envObj[k] = next;
                note('guessed', svcName + ': ' + k + ' zeigt jetzt auf ' + next + '. Service-Namen nach dem ersten Sync mit kubectl get svc gegenprüfen.');
              }
            }
          }

          // CNPG: replace the postgres container with a Cluster
          let db = null;
          if (pg && opts.cnpg !== false) {
            const cluster = name + '-db';
            const appSecret = cluster + '-app';
            delete controllers[pg.ctrlName];
            for (const [id, s] of Object.entries(serviceBlock)) if (s.controller === pg.ctrlName) delete serviceBlock[id];
            delete dnsMap[pg.svcName];
            for (const [key, entry] of Object.entries(persistence)) {
              const before = entry.__mounts.length;
              entry.__mounts = entry.__mounts.filter((m) => m.ctrl !== pg.ctrlName);
              if (!entry.__mounts.length) { delete persistence[key]; usedPersist.delete(key); }
              else if (entry.__mounts.length !== before) entry.__wasPg = true;
            }
            for (let i = notes.length - 1; i >= 0; i--) {
              const n = notes[i];
              if ((n.text && n.text.indexOf(pg.svcName + ': ') === 0) || (n.group && n.item === pg.svcName)) notes.splice(i, 1);
            }
            for (const [key, entry] of Object.entries(persistence)) {
              if (entry.__wasPg) note('todo', 'PVC "' + key + '" war das Postgres-Datenverzeichnis und wird jetzt nur noch von anderen Services gemountet. Für Backups des Clusters stattdessen eine CNPG-Backup-CR nutzen.');
              delete entry.__wasPg;
            }
            const rewired = new Set();
            for (const [, envObj] of envPatch) {
              for (const k of Object.keys(envObj)) {
                if (!DB_ENV_HINT.test(k)) continue;
                const hit = CNPG_KEYS.find(([re]) => re.test(k));
                if (!hit) continue;
                envObj[k] = { valueFrom: { secretKeyRef: { name: appSecret, key: hit[1] } } };
                secretKeys.delete(k);
                rewired.add(k + ' → ' + hit[1]);
              }
            }
            if (rewired.size) note('guessed', 'Datenbank-Envs kommen jetzt aus dem CNPG-Secret ' + appSecret + ': ' + [...rewired].join(', ') + '.');
            if (pg.major && pg.major !== '18') note('todo', 'Compose pinnt Postgres ' + pg.major + ', der Cluster nutzt wie der Rest deines Repos 18. Bei einem Dump-Import die Major-Version angleichen.');
            note('todo', 'Der Cluster startet leer. Bestehende Daten per pg_dump/pg_restore in ' + pg.dbname + ' einspielen.');
            db = { cluster, dbname: pg.dbname, owner: pg.owner, size: pg.size, appSecret };
          } else if (pg) {
            note('todo', pg.svcName + ': bleibt ein normaler Postgres-Container mit PVC. Mit dem CNPG-Schalter wird daraus ein Cluster wie bei paperless.');
          }

          // finalize mounts
          const multi = Object.keys(controllers).length > 1;
          for (const entry of Object.values(persistence)) {
            const mounts = entry.__mounts;
            delete entry.__mounts;
            if (multi) {
              const adv = {};
              for (const { ctrl, mount } of mounts) { adv[ctrl] = adv[ctrl] || { app: [] }; adv[ctrl].app.push(mount); }
              entry.advancedMounts = adv;
            } else {
              entry.globalMounts = mounts.map((m) => m.mount);
            }
          }

          const defaultPodOptions = {
            labels: { workload: 'selfhosted' },
            topologySpreadConstraints: [{
              maxSkew: 1,
              topologyKey: 'kubernetes.io/hostname',
              whenUnsatisfiable: 'ScheduleAnyway',
              labelSelector: { matchLabels: { workload: 'selfhosted' } },
            }],
          };
          if (wantsGpu) {
            defaultPodOptions.nodeSelector = { 'intel.feature.node.kubernetes.io/gpu': 'true' };
            defaultPodOptions.securityContext = { fsGroup: 1000, supplementalGroups: [44, 104] };
            if (!gpuCtrls.size && controllers[name]) gpuCtrls.add(name);
            for (const cn of gpuCtrls) {
              const mc = controllers[cn] && controllers[cn].containers.app;
              if (!mc) continue;
              mc.resources.requests['gpu.intel.com/i915'] = '1';
              mc.resources.limits = Object.assign({ memory: '4Gi' }, mc.resources.limits || {});
              mc.resources.limits['gpu.intel.com/i915'] = '1';
            }
          } else {
            defaultPodOptions.securityContext = { fsGroup: 1000 };
          }

          let ingress = null;
          if (opts.ingress !== false && serviceBlock.app) {
            ingress = {
              app: {
                enabled: true,
                annotations: { 'cert-manager.io/cluster-issuer': 'letsencrypt-cloudflare' },
                hosts: [{ host, paths: [{ path: '/', service: { identifier: 'app', port: Object.keys(serviceBlock.app.ports)[0] } }] }],
                tls: [{ secretName: name + '-tls', hosts: [host] }],
              },
            };
          } else if (opts.ingress !== false) {
            note('todo', 'Kein veröffentlichter Port gefunden → weder Service noch Ingress erzeugt.');
          }

          const secrets = { generate: [], external: [] };
          for (const k of [...secretKeys].sort()) (EXTERNAL_SECRET.test(k) ? secrets.external : secrets.generate).push(k);
          if (secretKeys.size) {
            notes.unshift({ kind: 'todo', text: secretKeys.size + ' Werte kommen per secretKeyRef aus "' + name + '-secret": ' + [...secretKeys].sort().join(', ') + '. Der fertige kubeseal-Befehl steht unten.' });
          }
          const PAIRS = [['MINIO_ROOT_PASSWORD', 'AWS_SECRET_ACCESS_KEY'], ['MINIO_ROOT_USER', 'AWS_ACCESS_KEY_ID'], ['MEILI_MASTER_KEY', 'MEILISEARCH_KEY']];
          for (const [a, b] of PAIRS) {
            if (secretKeys.has(a) && secretKeys.has(b)) {
              notes.push({ kind: 'todo', text: a + ' und ' + b + ' müssen denselben Wert haben — im Befehl unten einmal generieren und zweimal einsetzen, sonst kommt der Client nicht an den Bucket.' });
            }
          }

          return {
            name, category, host, secrets, db,
            valuesObj: { controllers, defaultPodOptions, service: serviceBlock, ingress, persistence },
            notes: compressNotes(notes, name),
          };
        }

        function compressNotes(notes, name) {
          const groups = {};
          const out = [];
          const seen = new Set();
          for (const n of notes) {
            if (n.group) { (groups[n.group] = groups[n.group] || { items: [] }).items.push(n.item); continue; }
            if (seen.has(n.text)) continue;
            seen.add(n.text);
            out.push({ kind: n.kind, text: n.text });
          }
          const uniq = (a) => [...new Set(a)];
          if (groups.pvcsize) out.push({ kind: 'guessed', text: 'PVC-Größen geraten: ' + uniq(groups.pvcsize.items).join(', ') + '. Longhorn kann nachträglich nur wachsen, nicht schrumpfen.' });
          if (groups.dependson) out.push({ kind: 'todo', text: 'depends_on bei ' + uniq(groups.dependson.items).join(', ') + ' hat keine Entsprechung. Die Pods starten parallel und crashen, bis die Abhängigkeit steht.' });
          if (groups.healthcheck) out.push({ kind: 'guessed', text: 'healthcheck bei ' + uniq(groups.healthcheck.items).join(', ') + ' ersetzt durch die TCP-Default-Probes des Charts.' });
          return out;
        }

        /* ---------- emitters ---------- */

        function emitApp(res, opts) {
          return [
            'apiVersion: argoproj.io/v1alpha1',
            'kind: Application',
            'metadata:',
            '  name: ' + res.name,
            '  namespace: argocd',
            'spec:',
            '  project: default',
            '  sources:',
            '    - repoURL: ghcr.io/bjw-s-labs/helm',
            '      chart: app-template',
            '      targetRevision: ' + (opts.chartVersion || '5.0.1'),
            '      helm:',
            '        valueFiles:',
            '          - $values/apps-manifests/' + res.category + '/' + res.name + '/values.yaml',
            '    - repoURL: ' + (opts.repoUrl || 'https://github.com/crocofied/homelab.git'),
            '      targetRevision: main',
            '      ref: values',
            '  destination:',
            '    server: https://kubernetes.default.svc',
            '    namespace: ' + res.category,
            '  syncPolicy:',
            '    automated:',
            '      prune: true',
            '      selfHeal: true',
            '',
          ].join('\n');
        }

        function emitValues(res, dump) {
          const o = res.valuesObj;
          const parts = [dump({ controllers: o.controllers }), dump({ defaultPodOptions: o.defaultPodOptions })];
          if (Object.keys(o.service).length) parts.push(dump({ service: o.service }));
          if (o.ingress) parts.push(dump({ ingress: o.ingress }));
          if (Object.keys(o.persistence).length) parts.push(dump({ persistence: o.persistence }));
          return parts.join('\n').trimEnd() + '\n';
        }

        function emitDb(res, opts) {
          if (!res.db) return null;
          const cluster = [
            'apiVersion: postgresql.cnpg.io/v1',
            'kind: Cluster',
            'metadata:',
            '  name: ' + res.db.cluster,
            '  namespace: ' + res.category,
            'spec:',
            '  instances: 1',
            '  inheritedMetadata:',
            '    labels:',
            '      workload: selfhosted',
            '  topologySpreadConstraints:',
            '    - maxSkew: 1',
            '      topologyKey: kubernetes.io/hostname',
            '      whenUnsatisfiable: ScheduleAnyway',
            '      labelSelector:',
            '        matchLabels:',
            '          workload: selfhosted',
            '  imageName: ghcr.io/cloudnative-pg/postgresql:18',
            '  storage:',
            '    size: ' + res.db.size,
            '    storageClass: longhorn',
            '  bootstrap:',
            '    initdb:',
            '      database: ' + res.db.dbname,
            '      owner: ' + res.db.owner,
            '  resources:',
            '    requests:',
            '      cpu: 200m',
            '      memory: 512Mi',
            '',
          ].join('\n');
          const app = [
            'apiVersion: argoproj.io/v1alpha1',
            'kind: Application',
            'metadata:',
            '  name: ' + res.db.cluster,
            '  namespace: argocd',
            '  annotations:',
            '    argocd.argoproj.io/sync-wave: "2"',
            'spec:',
            '  project: default',
            '  source:',
            '    repoURL: ' + (opts.repoUrl || 'https://github.com/crocofied/homelab.git'),
            '    targetRevision: main',
            '    path: infrastructure/databases/' + res.name,
            '  destination:',
            '    server: https://kubernetes.default.svc',
            '    namespace: ' + res.category,
            '  syncPolicy:',
            '    automated:',
            '      prune: true',
            '      selfHeal: true',
            '',
          ].join('\n');
          return { cluster, app };
        }

        function emitSecretCmd(res, shell) {
          const gen = res.secrets.generate;
          const ext = res.secrets.external;
          if (!gen.length && !ext.length) return null;
          const secretName = res.name + '-secret';

          if (shell === 'bash') {
            const L = ['kubectl create secret generic ' + secretName + ' -n ' + res.category + ' --dry-run=client -o yaml \\'];
            for (const k of gen) L.push('  --from-literal=' + k + '="$(openssl rand -hex 32)" \\');
            for (const k of ext) L.push('  --from-literal=' + k + "='HIER_EINTRAGEN' \\");
            L.push('  | kubeseal --format=yaml \\');
            L.push('      --controller-name=sealed-secrets \\');
            L.push('      --controller-namespace=sealed-secrets \\');
            L.push('  > infrastructure/secrets/' + secretName + '.yaml');
            if (ext.length) L.push('', '# HIER_EINTRAGEN vorher ersetzen: ' + ext.join(', '));
            return L.join('\n') + '\n';
          }

          // PowerShell, nach infrastructure/secrets/README.md
          const L = [];
          L.push('function New-Secret([int]$Bytes = 32) {');
          L.push('  $b = New-Object byte[] $Bytes');
          L.push('  [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)');
          L.push("  -join ($b | ForEach-Object { $_.ToString('x2') })");
          L.push('}');
          L.push('');
          L.push('$sealed = kubectl create secret generic ' + secretName + ' -n ' + res.category + ' `');
          for (const k of gen) L.push('  --from-literal=' + k + '="$(New-Secret 32)" `');
          for (const k of ext) L.push('  --from-literal=' + k + '="HIER_EINTRAGEN" `');
          L.push('  --dry-run=client -o yaml |');
          L.push('  kubeseal --format=yaml `');
          L.push('    --controller-name=sealed-secrets `');
          L.push('    --controller-namespace=sealed-secrets |');
          L.push('  Out-String');
          L.push('');
          L.push('[System.IO.File]::WriteAllText(');
          L.push('  "$PWD\\infrastructure\\secrets\\' + secretName + '.yaml",');
          L.push('  $sealed.TrimEnd() + "`n",');
          L.push('  [System.Text.Encoding]::ASCII)');
          if (ext.length) { L.push(''); L.push('# HIER_EINTRAGEN vorher ersetzen: ' + ext.join(', ')); }
          return L.join('\n') + '\n';
        }

        function guessName(rawCompose) {
          const c = resolveMerge(rawCompose) || {};
          if (typeof c.name === 'string' && c.name.trim()) return slug(c.name);
          const svcNames = Object.keys(c.services || {});
          if (!svcNames.length) return '';
          const first = svcNames.find((n) => normPorts(c.services[n]).length) || svcNames[0];
          return slug(String(first).replace(/[-_](server|app|web|frontend|core)$/i, ''));
        }



        /* ---------- glue ---------- */
        const SAMPLE = `name: immich
        services:
          immich-server:
            container_name: immich_server
            image: ghcr.io/immich-app/immich-server:v1.140.0
            volumes:
              - \${UPLOAD_LOCATION}:/data
              - /etc/localtime:/etc/localtime:ro
              - /mnt/nas/photos:/mnt/media/photos:ro
            environment:
              DB_USERNAME: postgres
              DB_PASSWORD: postgres
              DB_DATABASE_NAME: immich
              REDIS_HOSTNAME: redis
            ports:
              - '2283:2283'
            devices:
              - /dev/dri:/dev/dri
            depends_on:
              - redis
              - database
            restart: always
          redis:
            image: docker.io/valkey/valkey:8-bookworm
            volumes:
              - redis-data:/data
            restart: always
          database:
            image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3
            environment:
              POSTGRES_PASSWORD: postgres
              POSTGRES_USER: postgres
              POSTGRES_DB: immich
            volumes:
              - db-data:/var/lib/postgresql/data
            restart: always
        volumes:
          redis-data:
          db-data:
        `;

        const $ = (id) => document.getElementById(id);
        const inputs = ['f-cat', 'f-domain', 'f-tz', 'f-size', 'f-chart', 'f-gpu', 'f-ingress', 'f-cnpg', 'f-shell'];
        let nameTouched = false;

        // js-yaml quotes with single quotes; the repo style is double
        function prettyQuotes(s) {
          return s.replace(/: '([^'\n\\]*)'$/gm, (m, v) => (v.includes('"') ? m : ': "' + v + '"'));
        }
        const dump = (o) => prettyQuotes(jsyaml.dump(o, { indent: 2, lineWidth: -1, noRefs: true }));

        function setCard(id, path, body) {
          const on = !!body;
          $('card-' + id).hidden = !on;
          if (!on) return;
          $('p-' + id).textContent = path;
          $('out-' + id).textContent = body;
        }

        function render() {
          const text = $('in').value.trim();
          let doc = null, parseError = null;
          if (text) {
            try { doc = jsyaml.load(text); } catch (e) { parseError = e.message; }
          }

          if (doc && !nameTouched) {
            const guessed = guessName(doc);
            if (guessed) $('f-name').value = guessed;
          }

          const opts = {
            name: $('f-name').value || 'app',
            category: $('f-cat').value,
            domain: $('f-domain').value,
            tz: $('f-tz').value,
            defaultSize: $('f-size').value || '5Gi',
            chartVersion: $('f-chart').value || '5.0.1',
            gpu: $('f-gpu').checked,
            ingress: $('f-ingress').checked,
            cnpg: $('f-cnpg').checked,
          };
          const name = slug(opts.name);
          $('p-app').textContent = name + '.yaml';
          $('p-values').textContent = opts.category + '/' + name + '/values.yaml';

          if (!text) {
            $('out-app').textContent = '—';
            $('out-values').textContent = '—';
            setCard('dbcluster', '', null);
            setCard('dbapp', '', null);
            setCard('secret', '', null);
            showNotes([], 'Noch nichts konvertiert.');
            return;
          }
          if (parseError) { showNotes([{ kind: 'error', text: 'YAML lässt sich nicht lesen: ' + parseError }]); return; }

          try {
            const res = convert(doc, opts);
            $('out-app').textContent = emitApp(res, opts);
            $('out-values').textContent = emitValues(res, dump);
            const db = emitDb(res, opts);
            setCard('dbcluster', db ? res.name + '/' + res.db.cluster + '.yaml' : '', db && db.cluster);
            setCard('dbapp', db ? res.db.cluster + '.yaml' : '', db && db.app);
            const cmd = emitSecretCmd(res, $('f-shell').value);
            setCard('secret', 'infrastructure/secrets/' + res.name + '-secret.yaml', cmd);
            showNotes(res.notes, 'Alles direkt übersetzbar. Ungewöhnlich — schau die Values trotzdem einmal durch.');
          } catch (e) {
            showNotes([{ kind: 'error', text: e.message }]);
          }
        }

        function showNotes(notes, emptyMsg) {
          const order = { error: 0, todo: 1, guessed: 2, dropped: 3 };
          const sorted = notes.slice().sort((a, b) => order[a.kind] - order[b.kind]);
          const ul = $('notes');
          ul.innerHTML = '';
          const labels = { guessed: 'geraten', dropped: 'entfällt', todo: 'zu tun', error: 'fehler' };
          for (const n of sorted) {
            const li = document.createElement('li');
            li.dataset.kind = n.kind;
            const k = document.createElement('span');
            k.className = 'kind';
            k.textContent = labels[n.kind] || n.kind;
            const t = document.createElement('span');
            t.className = 'text';
            t.textContent = n.text;
            li.append(k, t);
            ul.append(li);
          }
          const counts = { todo: 0, guessed: 0, dropped: 0 };
          for (const n of notes) if (counts[n.kind] !== undefined) counts[n.kind]++;
          $('tally').innerHTML = notes.length
            ? `<span>zu tun <b>${counts.todo}</b></span><span>geraten <b>${counts.guessed}</b></span><span>entfällt <b>${counts.dropped}</b></span>`
            : '';
          $('empty').textContent = emptyMsg || '';
          $('empty').style.display = sorted.length ? 'none' : 'block';
        }

        function copyBtn(btnId, preId) {
          $(btnId).addEventListener('click', async () => {
            const txt = $(preId).textContent;
            if (!txt || txt === '—') return;
            try {
              await navigator.clipboard.writeText(txt);
            } catch (e) {
              const r = document.createRange();
              r.selectNodeContents($(preId));
              const sel = getSelection();
              sel.removeAllRanges();
              sel.addRange(r);
              document.execCommand('copy');
              sel.removeAllRanges();
            }
            const b = $(btnId);
            b.textContent = 'Kopiert';
            b.classList.add('done');
            setTimeout(() => { b.textContent = 'Kopieren'; b.classList.remove('done'); }, 1100);
          });
        }

        function boot() {
          inputs.forEach((id) => {
            $(id).addEventListener('input', render);
            $(id).addEventListener('change', render);
          });
          $('f-name').addEventListener('input', () => { nameTouched = true; render(); });
          let t;
          $('in').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 160); });
          $('btn-sample').addEventListener('click', () => {
            $('in').value = SAMPLE;
            nameTouched = false;
            $('f-cat').value = 'media';
            render();
          });
          ['app', 'values', 'dbcluster', 'dbapp', 'secret'].forEach((k) => copyBtn('btn-' + k, 'out-' + k));
          render();
        }

        if (window.jsyaml) boot();
        else window.addEventListener('load', () => {
          if (window.jsyaml) boot();
          else showNotes([{ kind: 'error', text: 'js-yaml wurde nicht geladen — offline nutzbar, wenn du js-yaml.min.js daneben legst und das script-Tag umbiegst.' }]);
        });
        </script>
        </body>
        </html>
