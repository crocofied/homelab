controllers:
  rustmailer:
    strategy: Recreate
    containers:
      app:
        image:
          repository: rustmailer/bichon
          tag: latest
        env:
          BICHON_ROOT_DIR: /data
          BICHON_ENCRYPT_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: rustmailer-secret
                key: BICHON_ENCRYPT_PASSWORD
          BICHON_LOG_LEVEL: info
          TZ: Europe/Berlin
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        probes:
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 5
          liveness:
            enabled: true
          readiness:
            enabled: true

defaultPodOptions:
  labels:
    workload: selfhosted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: selfhosted
  securityContext:
    fsGroup: 1000

service:
  app:
    controller: rustmailer
    ports:
      http:
        port: 15630

ingress:
  app:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - host: rustmailer.damians.cloud
        paths:
          - path: /
            service:
              identifier: app
              port: http
    tls:
      - secretName: rustmailer-tls
        hosts:
          - rustmailer.damians.cloud

persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    globalMounts:
      - path: /data
