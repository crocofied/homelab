controllers:
  actualbudget:
    strategy: Recreate
    containers:
      app:
        image:
          repository: actualbudget/actual-server
          tag: 26.9.0
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        env:
          ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: 20
          ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB: 50
          ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB: 20
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true

defaultPodOptions:
  labels:
    workload: selfhosted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: selfhosted

service:
  app:
    controller: actualbudget
    ports:
      http:
        port: 5006

ingress:
  app:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    hosts:
      - host: actual.damians.cloud
        paths:
          - path: /
            service:
              identifier: app
              port: http
    tls:
      - secretName: actual-tls
        hosts:
          - actual.damians.cloud

persistence:
  appdata:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
    advancedMounts:
      actualbudget:
        app:
          - path: /data