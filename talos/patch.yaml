machine:
  network:
    interfaces:
      - deviceSelector:
          physical: true
        dhcp: true
        vip:
          ip: 192.168.3.130        
  kubelet:
    extraMounts:                   
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options: [bind, rshared, rw]
cluster:
  allowSchedulingOnControlPlanes: true