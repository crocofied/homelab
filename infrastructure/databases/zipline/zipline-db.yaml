apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zipline-db
  namespace: media
spec:
  instances: 1
  inheritedMetadata:
    labels:
      workload: selfhosted
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          workload: selfhosted
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: zipline
      owner: zipline
  resources:
    requests:
      cpu: 200m
      memory: 512Mi