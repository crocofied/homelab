apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/crocofied/homelab.git
    targetRevision: main
    path: apps-manifests/media/base
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true