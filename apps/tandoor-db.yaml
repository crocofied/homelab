apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tandoor-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/crocofied/homelab.git
    targetRevision: main
    path: infrastructure/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
